apiVersion: v1
kind: Namespace
metadata:
  name: jobtracker
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jobtracker-config
  namespace: jobtracker
data:
  DATABASE_BACKEND: dynamodb
  AWS_REGION: AWS_REGION_PLACEHOLDER
  AWS_DEFAULT_REGION: AWS_REGION_PLACEHOLDER
  DYNAMODB_JOBS_TABLE: DYNAMODB_JOBS_TABLE_PLACEHOLDER
  DYNAMODB_STATE_TABLE: DYNAMODB_STATE_TABLE_PLACEHOLDER
  DYNAMODB_SCAN_RETENTION_DAYS: "DYNAMODB_SCAN_RETENTION_DAYS_PLACEHOLDER"
  ENABLE_SCHEDULER: "false"
  AUTH_ENABLED: "true"
  PUBLIC_BASE_URL: PUBLIC_BASE_URL_PLACEHOLDER
  COGNITO_REGION: COGNITO_REGION_PLACEHOLDER
  COGNITO_USER_POOL_ID: COGNITO_USER_POOL_ID_PLACEHOLDER
  COGNITO_CLIENT_ID: COGNITO_CLIENT_ID_PLACEHOLDER
  COGNITO_DOMAIN: COGNITO_DOMAIN_PLACEHOLDER
  COGNITO_ADMIN_GROUP: COGNITO_ADMIN_GROUP_PLACEHOLDER
  PYTHONUNBUFFERED: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobtracker
  namespace: jobtracker
  labels:
    app.kubernetes.io/name: jobtracker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jobtracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobtracker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: jobtracker-config
            - secretRef:
                name: jobtracker-secrets
                optional: true
            - secretRef:
                name: jobtracker-origin-secret
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: "2"
              memory: 1200Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: shared-memory
              mountPath: /dev/shm
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 384Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jobtracker-scan
  namespace: jobtracker
spec:
  schedule: "*/15 * * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jobtracker-scan
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: scanner
              image: IMAGE_PLACEHOLDER
              imagePullPolicy: IfNotPresent
              command:
                - python
                - scheduled_scan.py
              envFrom:
                - configMapRef:
                    name: jobtracker-config
                - secretRef:
                    name: jobtracker-secrets
                    optional: true
              resources:
                requests:
                  cpu: 100m
                  memory: 384Mi
                limits:
                  cpu: "2"
                  memory: 1200Mi
              volumeMounts:
                - name: shared-memory
                  mountPath: /dev/shm
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: shared-memory
              emptyDir:
                medium: Memory
                sizeLimit: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jobtracker
  namespace: jobtracker
spec:
  selector:
    app.kubernetes.io/name: jobtracker
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobtracker
  namespace: jobtracker
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jobtracker
                port:
                  name: http
